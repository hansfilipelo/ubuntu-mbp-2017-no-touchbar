# MacBookPro14,1 kernel parameters (sourced by update-grub).
# Appends each parameter only if it is not already present, so it is safe
# alongside a /etc/default/grub that was edited by hand.
for p in \
    intel_iommu=off \
    acpi_sleep=nonvs \
    button.lid_init_state=open \
    nvme_core.default_ps_max_latency_us=0 \
    nvme.noacpi=1 \
    pci=noaer \
    i915.enable_dc=0 \
    i915.enable_fbc=0 \
    i915.enable_psr=0
do
    case " $GRUB_CMDLINE_LINUX_DEFAULT " in
        *" $p "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT $p" ;;
    esac
done
unset p
